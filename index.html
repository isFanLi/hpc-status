<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>嘉庚智算 · 资源</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f5f4; --card:#ffffff; --sunk:#f1f0ee; --line:#e7e6e3; --line2:#efeeec;
  --t1:#1a1918; --t2:#56544f; --t3:#9a978f; --ink:#1a1918;
  --good:#0ca30c; --good-ink:#0a7a0a; --good-soft:#e6f5e6; --good-line:#b9e1b9; --good-tint:#f5fbf5;
  --warn:#fab219; --warn-ink:#8f5f00; --warn-soft:#fef4dc; --warn-line:#f5d68c;
  --crit:#d03b3b; --crit-ink:#b42d2d; --crit-soft:#fbe9e9; --crit-line:#f0bcbc;
  --off:#b9b7b1; --off-soft:#eeedea;
  --mine:#6250d6; --mine-soft:#ecebfb;
  --track:#ecebe8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 1px 1px rgba(20,20,20,.02);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131312; --card:#1b1b1a; --sunk:#232322; --line:#2e2e2c; --line2:#262625;
  --t1:#f1f0ec; --t2:#c2c0b8; --t3:#86847d; --ink:#f1f0ec;
  --good:#0ca30c; --good-ink:#4cc94c; --good-soft:#142b15; --good-line:#245a26; --good-tint:#161f16;
  --warn:#fab219; --warn-ink:#f5c45a; --warn-soft:#33290f; --warn-line:#6a5218;
  --crit:#d03b3b; --crit-ink:#f07070; --crit-soft:#341a1a; --crit-line:#6b2b2b;
  --off:#55544f; --off-soft:#262625;
  --mine:#9085e9; --mine-soft:#26233f;
  --track:#2b2b29;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#2f9e3a; --s7:#9085e9; --s8:#e66767;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--t1);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
button{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}

/* 顶栏 */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(1.5) blur(12px);-webkit-backdrop-filter:saturate(1.5) blur(12px)}
.top{display:flex;align-items:center;gap:16px;padding:22px 0 0}
.title{display:flex;align-items:baseline;gap:14px;min-width:0}
.title h1{margin:0;font-size:29px;font-weight:700;letter-spacing:-.4px;white-space:nowrap}
.title .meta{color:var(--t3);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);font-size:14px;white-space:nowrap;box-shadow:var(--shadow)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.pill.stale .dot{background:var(--warn)}
.pill b{font-weight:600}
button.pill{cursor:pointer}
button.pill:hover{border-color:var(--t3)}
nav{display:flex;gap:28px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{all:unset;cursor:pointer;padding:10px 0 12px;color:var(--t2);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button:hover{color:var(--t1)}
nav button[aria-selected="true"]{color:var(--t1);font-weight:600;border-bottom-color:var(--ink)}
nav .cnt{color:var(--t3);font-weight:400;margin-left:4px}
main.wrap{padding-top:28px;padding-bottom:72px}
.tab{display:none}.tab.on{display:block}

/* 汇总面板 */
.panel{display:grid;grid-template-columns:minmax(0,3.4fr) repeat(3,minmax(0,1fr));background:var(--card);
  border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.panel>div{padding:26px 30px;border-left:1px solid var(--line2);min-width:0}
.panel>div:first-child{border-left:0}
.k{color:var(--t2);font-size:14.5px;display:flex;align-items:center;gap:8px}
.v{font-size:44px;font-weight:650;letter-spacing:-1px;line-height:1.15;margin:8px 0 6px}
.v small{font-size:20px;color:var(--t3);font-weight:450;letter-spacing:0;margin-left:4px}
.c-good{color:var(--good-ink)}.c-warn{color:var(--warn-ink)}.c-crit{color:var(--crit-ink)}
.h{color:var(--t3);font-size:14px}
.minibar{height:6px;border-radius:4px;background:var(--track);overflow:hidden;margin:12px 0 10px}
.minibar i{display:block;height:100%;border-radius:4px}
.avail{display:flex;gap:28px;align-items:flex-start}
.avail .l{flex:none;min-width:150px}
.avail .r{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{width:58px;height:62px;border-radius:10px;border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;position:relative;transition:transform .1s}
.chip:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.chip .n{font-size:11.5px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.chip .s{font-size:14px;font-weight:650}
.chip.good{background:var(--good);color:#fff}
.chip.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn-ink)}
.chip.crit{background:var(--crit-soft);border-color:var(--crit-line);color:var(--crit-ink)}
.chip.off{background:var(--off-soft);color:var(--t3)}
.chip .me{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--mine);box-shadow:0 0 0 2px var(--card)}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:16px;color:var(--t2);font-size:14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{color:var(--t1);font-weight:600}
.sq{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--t3)}
.btn code{font:12.5px ui-monospace,"SF Mono",Menlo,monospace;color:var(--t2)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;padding:9px 16px}
.btn.pri:hover{opacity:.88}
.btn.ok{border-color:var(--good);color:var(--good-ink);background:var(--good-soft)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.link{all:unset;cursor:pointer;color:var(--t2);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.link:hover{color:var(--t1)}
pre.ai{white-space:pre-wrap;word-break:break-word;margin-top:16px !important;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  font:12.5px/1.7 ui-monospace,"SF Mono",Menlo,monospace;color:var(--t2);margin:14px 0 0;max-height:340px;overflow:auto}

/* 区块 */
.sec{margin-top:44px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px;flex-wrap:wrap}
.sh h2{margin:0;font-size:21px;font-weight:650;letter-spacing:-.2px}
.sh p{margin:4px 0 0;color:var(--t3);font-size:14px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);padding:3px;border-radius:10px;gap:2px;border:1px solid var(--line2)}
.seg button{all:unset;cursor:pointer;padding:5px 13px;border-radius:8px;font-size:13.5px;color:var(--t2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--t1);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px 16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-width:0;transition:border-color .12s,box-shadow .12s;position:relative;overflow:hidden}
.card:hover{border-color:var(--t3)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--lv,transparent)}
.card.focus{outline:2px solid var(--ink);outline-offset:-1px}
.card.good{background:var(--good-tint);border-color:var(--good-line)}
.card.off{opacity:.62}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ch .nm{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;background:var(--sunk);color:var(--t2);font-size:13.5px;white-space:nowrap;font-weight:500}
.st i{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.st.good{background:var(--good-soft);color:var(--good-ink)}.st.good i{background:var(--good)}
.st.warn{background:var(--warn-soft);color:var(--warn-ink)}.st.warn i{background:var(--warn)}
.st.crit{background:var(--crit-soft);color:var(--crit-ink)}.st.crit i{background:var(--crit)}
.st.off{background:var(--off-soft);color:var(--t3)}.st.off i{background:var(--off)}
.st.mine{background:var(--mine-soft);color:var(--mine)}.st.mine i{background:var(--mine)}
.model{color:var(--t3);font-size:13.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:14px 0 16px}
.big .bn{font-size:48px;font-weight:650;letter-spacing:-1.2px;line-height:1}
.big .bn small{font-size:19px;color:var(--t3);font-weight:450;letter-spacing:0;margin-left:3px}
.slots{flex:1;max-width:54%;height:52px;display:flex;gap:3px;align-items:stretch}
.slots i{flex:1;border-radius:5px;position:relative}
.slots i.free{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--good-line)}
.card.good .slots i.free{background:#fff0}
.slots i.good{background:var(--good)}.slots i.warn{background:var(--warn)}.slots i.crit{background:var(--crit)}
.slots i.mine{background:var(--mine)}
.slots i.blk{background:repeating-linear-gradient(135deg,var(--crit-soft) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1.5px var(--crit-line)}
.slots i.off{background:repeating-linear-gradient(135deg,var(--off-soft) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px var(--off)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14.5px;color:var(--t2)}
.row b{color:var(--t1);font-weight:600}
.row .u{color:var(--t3)}
.bar{height:6px;border-radius:4px;background:var(--track);margin:8px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.jobs{font-size:14px;line-height:1.85;color:var(--t2);min-height:52px;margin-top:2px}
.jobs div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jobs b{color:var(--t1);font-weight:600}
.jobs .me b{color:var(--mine)}
.cf{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line2);color:var(--t3);font-size:13.5px}
.cf span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 分区卡片 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px 16px;box-shadow:var(--shadow);cursor:pointer;position:relative;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--lv,transparent)}
.pc:hover{border-color:var(--t3)}
.pc.sel{outline:2px solid var(--ink);outline-offset:-1px}
.pc .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pc .t b{font-size:16px;font-weight:650}
.pc .bn{font-size:34px;font-weight:650;letter-spacing:-.6px;margin:10px 0 0}
.pc .bn small{font-size:15px;color:var(--t3);font-weight:450;letter-spacing:0;margin-left:3px}
.pc .h{font-size:13.5px;line-height:1.7}
.pc .spec{color:var(--t2);font-size:13.5px;margin-top:4px}

/* CPU 节点格子 */
.cells{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.cells i{width:18px;height:18px;border-radius:4px;display:block}

/* 规格 */
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px}
.sp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
.sp h3{margin:0;font-size:18px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.sp dl{display:grid;grid-template-columns:110px 1fr;gap:9px 14px;margin:16px 0 0;font-size:14.5px}
.sp dt{color:var(--t3)}
.sp dd{margin:0;color:var(--t1)}
.sp ul{margin:14px 0 0;padding-left:18px;color:var(--t2);font-size:14px;line-height:1.8}
.sp pre{white-space:pre-wrap;margin:14px 0 0;background:var(--sunk);border-radius:10px;padding:12px 14px;font:12.5px/1.65 ui-monospace,"SF Mono",Menlo,monospace;color:var(--t2);overflow:auto}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;color:var(--t2);font-size:14px;margin-bottom:18px;line-height:1.8}
.note b{color:var(--t1)}

/* 表格 */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:13px 18px;border-bottom:1px solid var(--line2);font-size:14.5px;white-space:nowrap}
th{color:var(--t3);font-weight:500;font-size:13.5px}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.me td{background:var(--mine-soft)}
.empty{color:var(--t3);padding:40px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:16px}
.err{background:var(--crit-soft);color:var(--crit-ink);padding:12px 16px;border-radius:12px;margin-bottom:18px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.alert{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:14px;color:var(--t2)}
.alert b{color:var(--t1)}
code.c{font:12.5px ui-monospace,"SF Mono",Menlo,monospace;background:var(--sunk);padding:2px 6px;border-radius:5px}

/* 图表 */
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px 14px;margin-bottom:18px;box-shadow:var(--shadow)}
.chart h3{margin:0;font-size:16.5px;font-weight:600}
.chart .d{color:var(--t3);font-size:13.5px;margin:3px 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chart svg{display:block;width:100%;overflow:visible}
.ax text{fill:var(--t3);font-size:11.5px}
.ax line{stroke:var(--line2)}
select{font:inherit;font-size:13.5px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--t1)}
.ln{display:inline-block;width:16px;height:3px;border-radius:2px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:14px;opacity:0;transition:all .2s;pointer-events:none;z-index:40}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tip{position:fixed;pointer-events:none;z-index:30;background:var(--ink);color:var(--bg);padding:9px 12px;border-radius:9px;font-size:13px;line-height:1.65;display:none;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.tip .tt{opacity:.65;margin-bottom:2px}
.tip .tl{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip .tl span{display:inline-flex;align-items:center;gap:6px}

@media (max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{grid-template-columns:1fr 1fr 1fr}
  .panel>div:nth-child(1){grid-column:1/-1;border-bottom:1px solid var(--line2)}.panel>div:nth-child(2){border-left:0}}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:0 20px}.title .meta{display:none}.specs{grid-template-columns:1fr}}
@media (max-width:620px){
  .wrap{padding:0 14px}.top{padding-top:14px;gap:8px}.title h1{font-size:23px}.right{gap:6px}
  .pill{height:32px;padding:0 11px;font-size:12.5px}
  #theme .tl{display:none}
  .grid{grid-template-columns:1fr}
  .panel{grid-template-columns:1fr 1fr}
  .panel>div{padding:18px 18px}
  .panel>div:nth-child(4){border-left:0;border-top:1px solid var(--line2)}
  .panel>div:nth-child(3){border-left:1px solid var(--line2)}
  .avail{flex-direction:column;gap:14px}
  .v{font-size:34px}.v small{font-size:16px}
  .chip{width:56px;height:56px}
  .big .bn{font-size:40px}
  nav{gap:20px}
  .sec{margin-top:32px}
  .pgrid{grid-template-columns:1fr}
  .sp dl{grid-template-columns:90px 1fr}
  .btn code{white-space:normal;word-break:break-all;font-size:11.5px}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <div class="title"><h1>嘉庚智算 资源</h1><span class="meta" id="meta"></span></div>
    <div class="right">
      <span class="pill" id="fresh"><span class="dot"></span><span></span></span>
      <button class="pill" id="theme"></button>
    </div>
  </div>
  <nav id="nav" role="tablist"></nav>
</div></header>
<main class="wrap" id="main"></main>
<div class="tip" id="tip"></div>

      <div class="big" style="margin-bottom:6px"><div class="bn num c-${p.cpu_free ? (l === "crit" ? "warn" : "good") : "crit"}">${nf(p.cpu_free)}<small>/ ${nf(p.cpu_total)} 核空闲</small></div>
        <div style="text-align:right;color:var(--t2);font-size:14.5px;line-height:1.7">整节点空闲 <b style="color:var(--t1)">${p.idle_nodes}</b> / ${p.n_nodes} 台<br>时限 ${fmtDur(p.maxtime_s)}${p.n_down ? ` · <span style="color:var(--t3)">${p.n_down} 台不可用</span>` : ""}</div></div>
      <div class="minibar" style="display:flex;gap:2px"><i style="width:${(T - p.cpu_free - down)/T*100}%;background:${LV[l]}"></i>${down ? `<i style="width:${down/T*100}%;background:var(--off)"></i>` : ""}</div>
      <div class="cells">${p.nodes.slice().sort(natural).map(x => cell(NB[x])).join("")}</div>
      <div class="cf" style="margin-top:14px"><span>运行 ${p.run_jobs} · 排队 ${p.pend_jobs}</span>
        ${p.cpu_free ? `<button class="btn sm" data-copy="${esc(`srun -p ${p.name} -N 1 -n ${Math.min(p.cpu_max_node, p.cpu_per_node)} --pty bash`)}">复制 srun</button>` : ""}</div></div>`; };
  el.innerHTML = `<div class="sh"><div><h2>CPU 分区</h2><p>每个小方块是一台节点：空心 = 全空，绿 &lt; 50%，黄 50–85%，红 ≥ 85%；悬停看详情</p></div></div>
    ${CP.map(pcard).join("") || `<div class="empty">没有纯 CPU 分区</div>`}`;
}

// 用户 / 我的作业
function renderUsers() {
  const el = $("#t-users"), mx = Math.max(1, ...S.users.map(u => u.gpus));
  el.innerHTML = `<div class="sh"><div><h2>按用户</h2><p>运行中作业占用的资源合计，按 GPU 数排序 · 共 ${S.n_jobs} 个作业${PUB && !DATA.show_users ? " · 公开页隐藏了用户名" : ""}</p></div></div>
    ${S.jobs_visible_all ? "" : `<div class="err" style="background:var(--warn-soft);color:var(--warn-ink)">集群设置了作业隐私，只能看到你自己的作业。</div>`}
    ${S.users.length ? `<div class="tbl"><table><thead><tr><th>用户</th><th style="width:32%">GPU</th><th class="r">CPU 核</th><th class="r">运行</th><th class="r">排队</th><th>分区</th></tr></thead><tbody>
    ${S.users.map(u => { const me = !PUB && u.user === S.user; return `<tr class="${me ? "me" : ""}"><td><b>${esc(u.user)}</b>${me ? "（我）" : ""}</td>
      <td><div style="display:flex;align-items:center;gap:10px"><b class="num" style="width:26px">${u.gpus || "–"}</b><div class="bar" style="flex:1;margin:0"><i style="width:${u.gpus/mx*100}%;background:${me ? "var(--mine)" : "var(--s1)"}"></i></div></div></td>
      <td class="r num">${nf(u.cpus)}</td><td class="r num">${u.run}</td><td class="r num">${u.pend}</td><td class="mono" style="color:var(--t2)">${esc(u.parts.join(", "))}</td></tr>`; }).join("")}</tbody></table></div>` : `<div class="empty">现在没有作业</div>`}`;
}
function renderMine() {
  const el = $("#t-mine");
  el.innerHTML = `<div class="sh"><div><h2>我的作业</h2><p>${esc(S.user)} · 排队作业的“预计开始”是 Slurm 的估算</p></div></div>
    ${S.mine.length ? `<div class="tbl"><table><thead><tr><th>作业</th><th>名称</th><th>状态</th><th>分区</th><th class="r">资源</th><th>已运行 / 时限</th><th>开始 / 预计开始</th><th>节点 / 原因</th></tr></thead><tbody>
    ${S.mine.map(j => `<tr><td class="num mono">${esc(j.id)}</td><td>${esc(j.name)}</td><td>${j.state === "RUNNING" ? `<span class="st good"><i></i>运行</span>` : j.state === "PENDING" ? `<span class="st warn"><i></i>排队</span>` : `<span class="st"><i></i>${esc(j.state)}</span>`}</td>
      <td class="mono">${esc(j.part)}</td><td class="r num">${j.cpus} 核${j.gpus ? ` · ${j.gpus} 卡` : ""}${j.nodes > 1 ? ` · ${j.nodes} 节点` : ""}</td><td class="num">${slurmDur(j.elapsed)} / ${esc(j.limit)}</td>
      <td class="num">${esc((j.start || "").replace("T", " "))}</td><td class="mono">${esc(j.reason)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">你现在没有作业</div>`}`;
}

// 趋势
function lineChart(host, list, opts) {
  const W = Math.max(300, host.clientWidth), Hh = 250, m = {l: 46, r: 14, t: 10, b: 28};
  const now = Date.now()/1000, t0 = now - opts.hours*3600, iw = W - m.l - m.r, ih = Hh - m.t - m.b;
  const all = list.flatMap(s => s.pts.map(p => p[1])), ymax = Math.max(1, ...all);
  const nice = (v => { const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; })(ymax);
  const X = t => m.l + (t - t0) / (now - t0) * iw, Y = v => m.t + ih - v / nice * ih;
  let g = `<g class="ax">`;
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4, y = Y(v); g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text x="${m.l - 8}" y="${y + 4}" text-anchor="end">${Number.isInteger(v) ? nf(v) : v.toFixed(1)}</text>`; }
  const stepH = opts.hours <= 24 ? (W < 500 ? 6 : 3) : opts.hours <= 72 ? 12 : 24;
  const d0 = new Date(t0*1000); d0.setMinutes(0, 0, 0);
  for (let tk = d0.getTime()/1000 + 3600; tk < now; tk += 3600) { const d = new Date(tk*1000);
    if (d.getHours() % stepH === 0) g += `<text x="${X(tk)}" y="${Hh - 6}" text-anchor="middle">${d.getHours() === 0 ? (d.getMonth()+1) + "/" + d.getDate() : p2(d.getHours()) + ":00"}</text>`; }
  g += `</g>`;
  let paths = "";
  for (const s of list) { let d = "", prev = null, dots = "";
    s.pts.forEach(([t, v], i) => { const brk = !prev || t - prev > 1800; d += (brk ? "M" : "L") + X(t).toFixed(1) + " " + Y(v).toFixed(1);
      const nx = s.pts[i+1]; if (brk && (!nx || nx[0] - t > 1800)) dots += `<circle cx="${X(t)}" cy="${Y(v)}" r="3" fill="${css(s.color)}"/>`; prev = t; });
    paths += `<path d="${d}" fill="none" stroke="${css(s.color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`; }
  host.innerHTML = `<svg class="lc" viewBox="0 0 ${W} ${Hh}" height="${Hh}">${g}${paths}<line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="${css("--t3")}" stroke-dasharray="3 3" style="display:none"/><g class="mk"></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  const svg = host.querySelector("svg"), xh = svg.querySelector(".xh"), mk = svg.querySelector(".mk");
  const off = () => { xh.style.display = "none"; mk.innerHTML = ""; hideTip(); };
  svg.addEventListener("mousemove", e => { const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    if (px < m.l || px > W - m.r) return off();
    const t = t0 + (px - m.l) / iw * (now - t0); let best = null;
    for (const s of list) for (const p of s.pts) if (best == null || Math.abs(p[0] - t) < Math.abs(best - t)) best = p[0];
    if (best == null || Math.abs(best - t) > 1800) return off();
    xh.setAttribute("x1", X(best)); xh.setAttribute("x2", X(best)); xh.style.display = "";
    let rows = "", mks = "";
    for (const s of list) { const p = s.pts.find(p => p[0] === best); if (!p) continue;
      rows += `<div class="tl"><span><i class="ln" style="background:${css(s.color)}"></i>${esc(s.name)}</span><b class="num">${nf(p[1])}${opts.unit}</b></div>`;
      mks += `<circle cx="${X(best)}" cy="${Y(p[1])}" r="4.5" fill="${css(s.color)}" stroke="${css("--card")}" stroke-width="2"/>`; }
    mk.innerHTML = mks; showTip(e, `<div class="tt">${fmtT(best)}</div>${rows}`); });
  svg.addEventListener("mouseleave", off);
}
function hourBars(host, pname, idx, unit, total) {
  const sum = Array(24).fill(0), cnt = Array(24).fill(0);
  for (const r of H) { const v = r.p[pname]; if (!v) continue; const h = new Date(r.t*1000).getHours(); sum[h] += v[idx]; cnt[h]++; }
  const avg = sum.map((s, i) => cnt[i] ? s / cnt[i] : null), mx = Math.max(1, ...avg.filter(v => v != null));
  const W = Math.max(300, host.clientWidth), Hh = 160, m = {l: 4, r: 4, t: 8, b: 24}, bw = (W - m.l - m.r) / 24;
  let s = "";
  avg.forEach((v, h) => { const x = m.l + h * bw + 1, ih = Hh - m.t - m.b, w = Math.max(2, bw - 3);
    if (v == null) s += `<rect x="${x}" y="${Hh - m.b - 2}" width="${w}" height="2" fill="${css("--line")}"/>`;
    else { const bh = Math.max(3, v / mx * ih), r = Math.min(4, w/2, bh), lv = lvl(1 - v / (total || mx));
      s += `<path d="M${x} ${Hh - m.b} V${Hh - m.b - bh + r} q0 -${r} ${r} -${r} H${x + w - r} q${r} 0 ${r} ${r} V${Hh - m.b}Z" fill="${css("--" + lv)}"
        data-tip="${h}:00–${h + 1}:00<br>平均空闲 <b>${v.toFixed(1)}</b>${unit}（占用 ${Math.round((1 - v/(total||mx))*100)}%）<br>${cnt[h]} 个样本"/>`; }
    if (h % 3 === 0) s += `<text x="${x + w/2}" y="${Hh - 6}" text-anchor="middle" fill="${css("--t3")}" font-size="11.5">${h}时</text>`; });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" height="${Hh}">${s}</svg>`;
}
function renderTrend() {
  const gp = GP.filter(usableP), cp = CP.filter(usableP);
  const el = $("#t-trend"), span = H.length ? (H[H.length-1].t - H[0].t) / 3600 : 0;
  const allP = [...gp, ...cp]; if (!state.hourPart && allP.length) state.hourPart = allP[0].name;
  const hp = S.partitions.find(p => p.name === state.hourPart);
  const lg = (ps, k) => `<div class="legend" style="margin:0 0 6px">${ps.map(p => `<span><i class="ln" style="background:var(${colorOf[k + p.name]})"></i>${esc(p.name)}</span>`).join("")}</div>`;
  el.innerHTML = `<div class="sh"><div><h2>趋势</h2><p>${H.length ? `已记录 ${H.length} 个样本，覆盖 ${span < 48 ? span.toFixed(1) + " 小时" : (span/24).toFixed(1) + " 天"}` : "还没有历史数据"} · ${AL.cron ? "集群每 5 分钟采样" : "集群没装定时采样，曲线会断断续续"}</p></div>
    <div class="seg">${[[24, "24 小时"], [72, "3 天"], [168, "7 天"]].map(([h, n]) => `<button aria-pressed="${state.range === h}" data-rg="${h}">${n}</button>`).join("")}</div></div>
    ${hp ? `<div class="chart"><h3>一天里什么时候最空</h3><div class="d">每个整点时段的平均空闲${hp.gpu_total ? " GPU" : "核数"}（全部历史样本）；颜色同样按占用率：绿闲、黄一般、红满
      <select id="hp">${allP.map(p => `<option ${p.name === state.hourPart ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div><div id="ch-h"></div></div>` : ""}
    ${gp.length ? `<div class="chart"><h3>空闲 GPU</h3><div class="d">单位：张 · 断开处是没有采样</div>${lg(gp, "g:")}<div id="ch-g"></div></div>` : ""}
    ${cp.length ? `<div class="chart"><h3>空闲 CPU 核</h3><div class="d">单位：核</div>${lg(cp, "c:")}<div id="ch-c"></div></div>` : ""}`;
  el.querySelectorAll("[data-rg]").forEach(b => b.onclick = () => { state.range = +b.dataset.rg; renderTrend(); });
  const hs = $("#hp"); if (hs) hs.onchange = e => { state.hourPart = e.target.value; renderTrend(); };
  if (gp.length) lineChart($("#ch-g"), gp.map(p => ({name: p.name, color: colorOf["g:" + p.name], pts: series(p.name, 0, state.range)})), {hours: state.range, unit: " 张"});
  if (cp.length) lineChart($("#ch-c"), cp.map(p => ({name: p.name, color: colorOf["c:" + p.name], pts: series(p.name, 2, state.range)})), {hours: state.range, unit: " 核"});
  if (hp) hourBars($("#ch-h"), hp.name, hp.gpu_total ? 0 : 2, hp.gpu_total ? " 张" : " 核", hp.gpu_total || hp.cpu_total);
}

const R = {ov: renderOv, spec: renderSpec, cpu: renderCpu, users: renderUsers, mine: renderMine, trend: renderTrend};
function renderTab(t) { R[t](); }
$("#main").innerHTML = TABS.map(([k]) => `<section class="tab ${k === state.tab ? "on" : ""}" id="t-${k}"></section>`).join("");
renderNav(); fresh(); renderTab(state.tab); setInterval(fresh, 15000);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (state.tab === "trend") renderTrend(); }, 150); });
if (PUB) setTimeout(function reload() { if (document.hidden) { addEventListener("visibilitychange", reload, {once: true}); return; }
  location.replace(location.pathname + "?t=" + Date.now() + location.hash); }, 5 * 60 * 1000);
</script>
